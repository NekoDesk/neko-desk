workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Neko Desk ASC
    environment:
      groups:
        - signing
      vars:
        XCODE_WORKSPACE: "mobile/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.siwon.nekodesk.mobile"
        WIDGET_BUNDLE_ID: "com.siwon.nekodesk.mobile.widget"
        TEAM_ID: "K9MGP9D5LK"
      node: "20"
      ruby: "3.2"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install Node dependencies
        script: |
          cd mobile
          npm ci

      - name: Prepare web assets
        script: |
          cd mobile
          npm run prepare-www

      - name: Sync Capacitor iOS
        script: |
          cd mobile
          npx cap sync ios
          # cap sync는 pod 플러그인만 packageClassList에 넣는다.
          # 앱 안에 직접 넣은 NekoWidgetPlugin은 여기서 다시 등록해야
          # 웹에서 부를 수 있다 (없으면 위젯이 늘 비어 보인다).
          node scripts/register-ios-plugins.js

      - name: Add Widget Extension target
        script: |
          gem install xcodeproj
          ruby scripts/add-ios-widget-target.rb

      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install

      - name: Set up code signing
        script: |
          set -ex

          # Private key 생성 (CERTIFICATE_PRIVATE_KEY 환경변수가 없을 때)
          # ⚠️ 매 빌드마다 새 키를 만들면 새 인증서가 생성돼 한도(2개)에 걸림
          #    첫 빌드 성공 후, 이 키를 Codemagic 환경변수에 저장할 것
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "No CERTIFICATE_PRIVATE_KEY found — generating new RSA key"
            openssl genrsa -out /tmp/cert_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cert_key.pem)
          fi

          # App Store 배포 프로파일 + Apple Distribution 인증서 fetch/create
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE --create

          keychain initialize
          keychain add-certificates

          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning

          echo "=== Applying profiles to project ==="
          xcode-project use-profiles --project mobile/ios/App/App.xcodeproj

      - name: Verify signing setup
        script: |
          echo "=== App target ==="
          xcodebuild -project mobile/ios/App/App.xcodeproj \
            -target App -showBuildSettings \
            | grep -E 'PRODUCT_NAME|PRODUCT_BUNDLE|CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM' || true
          echo ""
          echo "=== NekoWidget target ==="
          xcodebuild -project mobile/ios/App/App.xcodeproj \
            -target NekoWidget -showBuildSettings \
            | grep -E 'PRODUCT_NAME|PRODUCT_BUNDLE|CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM' || true
          echo ""
          echo "=== Provisioning profiles on disk ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none)"

      - name: Set version from tag
        script: |
          TAG=${CM_TAG#v}
          BUILD=$(($(date +%s) / 60))
          cd mobile/ios/App
          agvtool new-marketing-version "$TAG"
          agvtool new-version -all "$BUILD"
          echo "Version: $TAG  Build: $BUILD"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
