<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>NEKO DESK 알람</title>
<style>
  /* 색은 본체가 쓰는 테마 값을 주소로 넘겨받아 채운다 */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Galmuri14','Malgun Gothic',sans-serif; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; }

  .card {
    width:100%; height:100%;
    background:var(--panel); border:3px solid var(--frame);
    border-radius:12px; padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    animation:pop 0.28s ease, glow 1.1s ease-in-out infinite;
  }
  @keyframes pop {
    from { transform:translateY(-14px) scale(0.96); opacity:0; }
    to   { transform:none; opacity:1; }
  }
  /* 눈에 띄라고 테두리가 은은하게 뛴다 */
  @keyframes glow {
    0%, 100% { box-shadow:0 8px 24px rgba(0,0,0,0.28), 0 0 0 0 var(--yellow); }
    50%      { box-shadow:0 8px 24px rgba(0,0,0,0.28), 0 0 0 5px var(--yellow); }
  }

  .top { display:flex; align-items:center; gap:8px; }
  .top .ic { font-size:17px; }
  .top .ttl { font-size:12px; color:var(--frame-text); letter-spacing:1px; flex:1; }
  .msg { font-size:15px; color:var(--white); line-height:1.45; word-break:break-word;
         flex:1; display:flex; align-items:center; }
  .btm { display:flex; align-items:center; gap:10px; }
  .left { flex:1; font-size:11px; color:var(--gray); }
  button {
    font-family:inherit; font-size:12px; padding:7px 20px; cursor:pointer;
    background:var(--yellow); color:#000; border:none; border-radius:6px; font-weight:700;
  }
  button:hover { filter:brightness(1.08); }
</style></head>
<body>
  <div class="card">
    <div class="top"><span class="ic">⏰</span><span class="ttl">NEKO DESK</span></div>
    <div class="msg" id="msg"></div>
    <div class="btm">
      <span class="left" id="left"></span>
      <button id="ok" type="button">확인</button>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  // 테마 색 (본체에서 넘겨준다)
  const vars = ['panel','frame','frame-text','white','gray','yellow'];
  vars.forEach(k => {
    const v = q.get(k);
    if (v) document.documentElement.style.setProperty('--' + k, v);
  });

  document.getElementById('msg').textContent = q.get('msg') || '알람';
  document.getElementById('ok').textContent = q.get('ok') || '확인';

  // 확인을 누르거나, 그냥 두면 8초 뒤에 닫힌다
  let left = Number(q.get('sec')) || 8;
  const leftEl = document.getElementById('left');
  const fmt = () => leftEl.textContent = (q.get('after') || '{n}초 후 닫힘').replace('{n}', left);
  fmt();
  const tick = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(tick); window.close(); return; }
    fmt();
  }, 1000);
  document.getElementById('ok').onclick = () => { clearInterval(tick); window.close(); };
</script>
</body></html>
