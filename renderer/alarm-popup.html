<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>NEKO DESK 알람</title>
<style>
  /* 색은 본체가 쓰는 테마 값을 주소로 넘겨받아 채운다 */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Galmuri14','Malgun Gothic',sans-serif; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; }

  /* 창 가장자리에 여백을 둔다. 카드가 창에 딱 맞으면 아래 glow 의 바깥 테두리가
     창 밖으로 나가 잘려 보였다 — 빛나는 테를 두려면 그만큼 자리가 있어야 한다. */
  body { padding:9px; }

  .card {
    width:100%; height:100%;
    background:var(--panel); border:3px solid var(--frame);
    border-radius:12px; padding:12px 14px;
    display:flex; flex-direction:column; gap:9px;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    animation:pop 0.28s ease, glow 1.1s ease-in-out infinite;
  }
  @keyframes pop {
    from { transform:translateY(-14px) scale(0.96); opacity:0; }
    to   { transform:none; opacity:1; }
  }
  /* 눈에 띄라고 테두리가 은은하게 뛴다 (위 body 여백 안에서만 퍼진다) */
  @keyframes glow {
    0%, 100% { box-shadow:0 8px 24px rgba(0,0,0,0.28), 0 0 0 0 var(--yellow); }
    50%      { box-shadow:0 8px 24px rgba(0,0,0,0.28), 0 0 0 5px var(--yellow); }
  }

  .top { display:flex; align-items:center; gap:8px; }
  .top .ic { font-size:17px; }
  .top .ttl { font-size:12px; color:var(--frame-text); letter-spacing:1px; flex:1; }
  .msg { font-size:15px; color:var(--white); line-height:1.45; word-break:break-word;
         flex:1; display:flex; align-items:center; }

  .again-lbl { font-size:11px; color:var(--gray); }
  .again { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .again button {
    font-family:inherit; font-size:12px; padding:6px 0; cursor:pointer;
    background:transparent; color:var(--white);
    border:1px solid var(--gray); border-radius:6px;
  }
  .again button:hover { border-color:var(--yellow); color:var(--yellow); }

  #off {
    font-family:inherit; font-size:13px; padding:8px 0; cursor:pointer; width:100%;
    background:var(--yellow); color:#000; border:none; border-radius:6px; font-weight:700;
  }
  #off:hover { filter:brightness(1.08); }
</style></head>
<body>
  <div class="card">
    <div class="top"><span class="ic">⏰</span><span class="ttl">NEKO DESK</span></div>
    <div class="msg" id="msg"></div>
    <div class="again-lbl" id="againLbl"></div>
    <div class="again" id="again"></div>
    <button id="off" type="button"></button>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  // 테마 색 (본체에서 넘겨준다)
  ['panel','frame','frame-text','white','gray','yellow'].forEach(k => {
    const v = q.get(k);
    if (v) document.documentElement.style.setProperty('--' + k, v);
  });

  document.getElementById('msg').textContent = q.get('msg') || '알람';
  document.getElementById('againLbl').textContent = q.get('againLbl') || '뒤에 다시';
  document.getElementById('off').textContent = q.get('off') || '해제';

  // 다시 울릴 때까지의 시간. 본체가 '5,10,30,60' 처럼 넘겨준다.
  const mins = String(q.get('mins') || '5,10,30,60').split(',')
    .map(n => parseInt(n, 10)).filter(n => n > 0);
  const label = (n) => n >= 60
    ? (q.get('hourFmt') || '{n}시간').replace('{n}', n / 60)
    : (q.get('minFmt') || '{n}분').replace('{n}', n);

  const box = document.getElementById('again');
  mins.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label(n);
    b.onclick = () => send('snooze', n);
    box.appendChild(b);
  });
  document.getElementById('off').onclick = () => send('off', 0);

  /**
   * 고른 것을 본체에 알린다.
   *
   * 이 창은 스스로 닫히지 않는다 — 알람은 사람이 끄기 전까지 울려야 하니까.
   * (예전에는 8초가 지나면 혼자 닫혀서, 자리를 비운 사이에 울린 알람은
   *  울린 줄도 모르고 지나갔다.)
   */
  function send(action, min) {
    try { window.nekoAlarm && window.nekoAlarm.done(action, min); } catch (e) {}
    window.close();
  }
</script>
</body></html>
