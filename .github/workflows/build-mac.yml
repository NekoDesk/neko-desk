name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그 (예: v1.3.8). 비우면 빌드만 하고 아티팩트로 저장"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    # macos-latest 가 macOS 26.6 이미지(20260831)로 바뀌면서 서명이 깨졌다.
    # electron-builder 25 의 set-key-partition-list 가 새 키체인 동작과 맞지 않아
    # "SecKeychainUnlock: passphrase not correct" 로 멈춘다. 26.5 까지는 잘 됐다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 인증서가 등록돼 있으면 서명하고, 애플 계정까지 있으면 공증까지 받는다.
      # 없으면 예전처럼 서명 없이 빌드한다 (빌드가 멈추지 않도록).
      - name: Prepare signing
        id: signing
        env:
          P12: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 -d > "$RUNNER_TEMP/developerID.p12"
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "서명: 함"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "서명: 안 함 (APPLE_CERT_P12_B64 없음)"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "공증: 함"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "공증: 안 함 (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD 없음)"
          fi

      - name: Build macOS (dmg, arm64 + x64)
        env:
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          ARGS="--mac --publish never"
          if [ "${{ steps.signing.outputs.sign }}" = "true" ]; then
            export CSC_LINK="$RUNNER_TEMP/developerID.p12"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            ARGS="$ARGS --config.mac.notarize=true"
          fi
          npx electron-builder $ARGS

      # 실제로 서명이 붙었는지 눈으로 확인할 수 있게 남긴다
      - name: Verify signature
        if: steps.signing.outputs.sign == 'true'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          echo "앱: $APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|flags" || true
          echo "--- 게이트키퍼 판정 (공증 전이면 rejected가 정상) ---"
          spctl -a -vvv -t exec "$APP" 2>&1 || true

      # 태그로 돌 때도 남긴다. 예전에는 릴리스 업로드만 했는데, 릴리스가 아직
      # 없으면 그 단계에서 멎으면서 애써 만든 dmg 가 통째로 사라졌다.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          # 릴리스는 사람이 공개하기로 정했을 때만 만든다. 없으면 아티팩트로 남긴 채
          # 조용히 넘어간다 — 태그를 달았다고 곧바로 공개되지는 않는다.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.blockmap dist/latest-mac.yml --clobber
          else
            echo "릴리스 $TAG 가 없다 — 아티팩트로만 남긴다."
            echo "공개할 때: gh release create $TAG 뒤에 이 워크플로를 다시 돌리면 붙는다."
          fi
