name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그 (예: v1.3.8). 비우면 빌드만 하고 아티팩트로 저장"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (dmg, arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          # 서명 없이 빌드 (Apple Developer 인증서 없음)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts (no tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" dist/*.dmg dist/*.blockmap dist/latest-mac.yml --clobber
